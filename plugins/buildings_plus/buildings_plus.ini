; ============================================================================
;  Buildings Plus 0.1.2 - Configuration
; ============================================================================
;  New buildings declared instead of hand-built. UTF-8, no BOM.
;
;  Every section that is not [buildings_plus] is one building: it names a
;  base-game building to clone (the donor), the building.ini lines that are to
;  be different, and nothing else. At startup - before the game has read its
;  first file - the plugin writes the whole Workshop item out to
;  media_soviet\workshop_wip\<id>\, assets included.
;
;  This plugin patches nothing. It reads no game structure and installs no
;  hook, so no game update can invalidate it. What it can break is a
;  building.ini, and the game says so in its own log.
;
;  Every generated folder carries tesmioloader.stamp; a folder without one is
;  never touched, so an id that collides with a real Workshop subscription is
;  refused rather than overwritten. Delete a folder to have it written again.
;
;  The same section format is read by Soviet Mod Loader from a mod's
;  tesmio\buildings.ini, so one declaration serves both loaders.
;
;  File format:
;    - Use ';' for full-line comments; no inline comments
;    - Section and key names are case-insensitive
;    - line = ... and desc = ... may repeat; every line is one entry
;    - Never write a $TOKEN inside a ';' comment in a building section
; ============================================================================


; ----------------------------------------------------------------------------
; [buildings_plus]  Plugin switches
; ----------------------------------------------------------------------------
[buildings_plus]

; 1 generates the declared buildings at every game start; 0 unloads the plugin.
; The folders written last time stay where they are and the game keeps loading
; them - set prune = 1 and keep enabled = 1 with no sections to remove them.
enabled = 1

; 1 removes generated folders in workshop_wip whose section is gone or switched
; off. Only folders that carry this plugin's stamp are removed, never a real
; Workshop item and never a folder written by another generator. Default 0.
prune = 0

; 1 rewrites every folder at every launch. 0 - the default - rewrites only when
; the section, the plugin or a donor file changed, which keeps a 300 KB mesh
; from being copied at every start.
always = 0

; 1 writes one line per copied file and per dropped donor line to
; logs\tesmioloader.buildings_plus.log. Default 0.
verbose = 0


; ----------------------------------------------------------------------------
; Building sections
; ----------------------------------------------------------------------------
;   id      optional. The Workshop item id and the folder name, a number
;           between 9000000000 and 9999999999 (never a real Steam item). Leave
;           it out and the plugin assigns one at game start: the highest number
;           seen in 9300000000..9399999999 (catalog, declared ids, folders under
;           workshop_wip) plus one, kept in plugins\buildings_plus.ids.ini under
;           the section name for good - a saved game refers to the folder by
;           that number. Two sections may not share an id.
;   donor   a name under media_soviet\buildings_types\ without .ini - the
;           building whose mesh, textures, collision box, fire points, icon and
;           building.ini are the starting point. Match the shape, not the
;           looks: a mine wants a mine, a factory wants a factory.
;   object  the object subfolder and what $OBJECT_BUILDING names. Letters,
;           digits and _ only; defaults to the section name.
;   name    $NAME_STR and the name in the build menu. Plain text, no quotes.
;   desc    the Workshop description. Repeatable - each line is one line.
;   life    renderconfig LIFE. Default 3000.
;   enabled 0 skips this section (and lets prune remove its folder).
;
;   line    a building.ini line, verbatim. Repeatable, emitted in order.
;           This is the whole of the economy: whatever a building.ini can say,
;           say it here.
;   strip   a $TOKEN to take out of the donor without putting anything back.
;           Repeatable.
;
; The donor's file is copied line for line - every $CONNECTION_*, $COST_WORK*,
; $VEHICLE_STATION, $PARTICLE and $TEXT_CAPTION is measured against the mesh
; and must survive - and a line is dropped only when a declared line replaces
; it. Most tokens replace only themselves. Four families replace each other:
;   $NAME and $NAME_STR
;   every $TYPE_*                               only one may be in effect
;   every $STORAGE* and $RESOURCE_VISUALIZATION  the visualisation counts
;                                                storages from zero, so
;                                                re-declaring them moves piles
;   $PRODUCTION, $CONSUMPTION, $CONSUMPTION_PER_SECOND - a recipe goes whole
; $PRODUCTION_SEWAGE_POLLUTION and $CONSUMPTION_WATER_REQUIRED_QUALITY are
; settings, not recipe lines, and survive a new recipe.
; The first $TOKEN anywhere in a line is what counts, because that is what the
; game's own parser matches - a building.ini has no comment syntax.


; Example, DISABLED by default: a chemist's shop cloned from the clothes shop.
; `medicine` has to exist as a resource (for example through the Resources
; plugin) before this makes sense.
[example_pharmacy]
enabled = 0
donor   = shop_clothes
object  = Pharmacy
name    = Pharmacy
desc    = A chemist's shop. Sells medicine, and nothing else.
line    = $TYPE_SHOP
line    = $WORKERS_NEEDED 8
line    = $CITIZEN_ABLE_SERVE 6
line    = $STORAGE_SPECIAL RESOURCE_TRANSPORT_COVERED 8 medicine
