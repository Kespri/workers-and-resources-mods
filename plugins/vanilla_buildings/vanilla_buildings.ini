; ============================================================================
;  Vanilla Buildings Plugin 1.3 - Configuration
; ============================================================================
;  Temporary patches for Vanilla, DLC and Workshop building INIs.
;  Repeated target lines in one section share all its patch commands.
;
;  File format:
;    - UTF-8 without BOM
;    - Use ';' for full-line comments; no inline comments
;    - Section and key names are case-insensitive
;    - Game directive names and complete source-line matches are case-sensitive
;    - Each command occupies one physical line; '|' separates its fields
;    - A line containing only '-' characters is accepted as a separator
;
;  Safety and fallback behavior:
;    - Original game and Workshop files are NEVER modified.
;    - Every enabled building is checked against the unchanged original file.
;    - Invalid global settings or an ambiguous file layout reject the plugin.
;    - A rejected target does not block other valid targets, even in its section.
;    - All declarations of a duplicate target are rejected; other targets continue.
;    - Temporary copies are generated in a new session directory.
;    - Changes require a game restart, but no DLL rebuild.
;
;  Requirements:
;    - TesmioLoader API 4
;    - Reference game version: WRSR 1.1.1.9
;    - No mandatory Localization or Resources service dependency
;    - Any mod resources referenced by a patch must still exist in the game
;
;  Limits:
;    - Plugin INI and each original building INI: maximum 4 MiB
;    - Generated building INI: maximum 8 MiB
;    - Building sections: maximum 256; target files in total: maximum 256
;    - Commands per building: maximum 512
;    - Active configuration line: maximum 4096 bytes
; ============================================================================


; ----------------------------------------------------------------------------
; [general]  General plugin settings
; ----------------------------------------------------------------------------
[general]

; Enable plugin. Only the exact values 0 and 1 are accepted; default is 1.
; With all building sections disabled, the plugin installs no hook.
enabled = 1

; Diagnostic logging. Only the exact values 0 and 1 are accepted; default is 0.
;   0 = each rejected target with exact cause; first successful open per target
;   1 = additional disabled-target details and every successful redirected open
; Detail log: tesmioloader.vanilla_buildings.log
debug = 0

; Compatibility: [vanilla_buildings] and verbose remain accepted aliases.
; Do not combine both global section names or both debug keys in one file.


; ----------------------------------------------------------------------------
; Building sections and patch commands
; ----------------------------------------------------------------------------
; Each section needs a unique name, one or more targets and at least one command.
; enabled defaults to 1; set it explicitly to avoid activating examples.
; Repeat target = ... for every building that should receive the same rules.
; Paths determine the root automatically:
;   buildings_types\technical_services_small.ini -> <game>\media_soviet
;   dlc1\buildings\concert_hall\building.ini      -> <game>\media_soviet
;   2496571917\utrzymanie1\building.ini           -> <Steam library>\steamapps\workshop\content\784150
; The Workshop root follows the Steam library containing the game.
; DLC targets: dlcN\buildings\...\building.ini; Workshop: numeric ID\...\building.ini.
; target1/target2/target3 are optional typed aliases for Vanilla/DLC/Workshop.
; Absolute paths, '.', '..', and invalid Windows path names are rejected.
; Existing saved buildings are NOT retrofitted by this plugin.
;
; Repeated command keys are allowed with different fields; identical commands
; and repeated enabled keys are rejected. Repeated target keys are supported.
; All commands apply to every target independently of their position in the section.
; Every rejected target logs its section, path, exact cause and offending command.
; No partial patch is applied to a rejected target; valid siblings continue.
;
; replace = complete old line | complete new line
; replace_connection = old token | first XYZ point | second XYZ point | new token
; remove = complete line
; remove_connection = token | first XYZ point | second XYZ point
; add = new independent single line
; add_connection = token | first XYZ point | second XYZ point
; insert_before = unique anchor line | new single line
;
; Each matched line or connection must occur exactly once. Overlapping edits,
; occupied connection points and new *_ALLOWPASS connections are rejected.
; For $COST_RESOURCE_AUTO, insert_before requires a $COST_WORK phase anchor.
; Single-line commands cannot safely edit multi-line geometry blocks.
; The plugin checks patch structure, not every game-specific directive value.
; ----------------------------------------------------------------------------

; Shared-rules example (commented out; does not activate or modify any building):
; [shared_grit]
; enabled = 1
; target = buildings_types\technical_services.ini
; target = buildings_types\technical_services_small.ini
; target = buildings_types\technical_services_big.ini
; target = 2496571917\utrzymanie1\building.ini
; target = 2496571917\utrzymanie2\building.ini
; target = 2496571917\utrzymanie3\building.ini
; add = $STORAGE_IMPORT_SPECIAL RESOURCE_TRANSPORT_GRAVEL 120 road_salt
; add = $STORAGE_IMPORT_SPECIAL RESOURCE_TRANSPORT_GRAVEL 120 gravel
; add = $STORAGE_IMPORT_SPECIAL RESOURCE_TRANSPORT_GRAVEL 120 sand
; Do not duplicate targets already enabled below. If an add line already exists
; in a manually edited source, that target is rejected with a precise warning.


; Complete syntax example, DISABLED by default.
; The values and connection points match the tested Vanilla plastics factory.
; Before enabling it, keep only the commands you actually want to apply.
[example_plastics_factory]
enabled = 0
target = buildings_types\plastics_factory.ini

replace = $PRODUCTION plastics 0.11 | $PRODUCTION plastics 0.20
replace_connection = $CONNECTION_CONNECTION | 14.5 0.0 23.3 | 14.5 0.0 21.3 | $CONNECTION_WATERPIPE_INPUT

remove = $CONSUMPTION_PER_SECOND eletric 0.26
remove_connection = $CONNECTION_CONNECTION | -23.4 0.0 15.9 | -21.4 0.0 15.9

add = $PRODUCTION glass 0.45
add_connection = $CONNECTION_WATERPIPE_OUTPUT | 30 0 0 | 32 0 0

insert_before = $COST_WORK SOVIET_CONSTRUCTION_STEEL_LAYING 1.0 | $COST_RESOURCE_AUTO steel 2.0
; ----------------------------------------------------------------------------
