; ============================================================================
;  UI Layout Fixes Plugin 1.1 - Configuration
; ============================================================================
;  This file configures window-specific UI corrections for WRSR.
;
;  File format:
;    - UTF-8 without BOM
;    - Use ';' for full-line comments
;    - Do not append inline comments to settings
;    - Do not repeat sections or keys
;
;  Safety and fallback behavior:
;    - The original game files are NEVER modified.
;    - The plugin changes only verified code and data in the running process.
;    - The executable build, instructions and call targets are checked before
;      a module writes its patch.
;    - An unsupported build or signature mismatch leaves the module inactive.
;    - Restart the game to remove an active patch completely.
;    - Settings are read during initialization; restart the game after changes.
;    - Unknown or misspelled sections and keys are ignored by the current
;      configuration reader, and the corresponding compiled default is used.
;
;  Requirements:
;    - TesmioLoader API 4
;    - Exact supported executable: SOVIET64.exe 1.1.1.9 (64-bit)
;
;  Scope and limits:
;    - There is intentionally no global row-spacing setting.
;    - Currently supported window module: CUSTOMHOUSE
;    - Resource row pitch: finite decimal value from 25.0 through 60.0
;
;  Detail log: tesmioloader.ui_layout_fixes.log
; ============================================================================


; ----------------------------------------------------------------------------
; [general]  General plugin settings
; ----------------------------------------------------------------------------
[general]

; Enable the complete plugin. Use one of the documented values:
;   0 = disable all modules; no patch is written
;   1 = enable individually configured modules
enabled = 1


; ----------------------------------------------------------------------------
; [customhouse]  Customs-house resource-list spacing
; ----------------------------------------------------------------------------
[customhouse]

; Enable only the CUSTOMHOUSE module. This setting has no effect when the
; complete plugin is disabled in [general].
;   0 = disable the module; no CUSTOMHOUSE patch is written
;   1 = enable the module
enabled = 1

; Vertical distance between rows in the customs-house resource list, measured
; in logical pixels. This affects only the verified list measurement and draw
; calls; unrelated windows and the native layout/scroll logic remain unchanged.
;
;   Native game value: 25.0
;   Plugin default:    30.0
;   Allowed range:     25.0 .. 60.0 inclusive
;
; Use a decimal point. Invalid, non-finite or out-of-range values produce a
; warning and fall back to 30.0. A value of 25.0 keeps the native row spacing.
resource_row_pitch = 30.0
