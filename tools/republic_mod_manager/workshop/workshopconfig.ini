### Republic Mod Manager – Settings and Loading for TesmioLoader Plugins

[DISCLAIMER] Attention, comrade: this tool was written with the help of an artificial intelligence. The five-year plans behind it were still drawn up, tested and sworn at by a human every time the game crashed. If you do not want AI in your code, just stick to the base game. No hard feelings, no re-education.

[DISCLAIMER] This tool changes files in the tesmioloader folder of the game. Errors or issues may still occur, and functionality may change as the tool continues to be developed and improved.

A Windows program that lists your subscribed TesmioLoader plugin packages, shows every setting with a description, range check and reset button, switches plugins on and off, and starts the game through the TesmioLauncher. The Workshop Bridge that ships with it loads Workshop packages directly, without the Soviet Mod Loader. Everything is in German and English.

-- Features
[list]
[*]One list with every subscribed plugin package and every plugin installed in tesmioloader\build\plugins.
[*]Settings pages generated from the package schema: tabs, cards, switches, number fields with plus and minus, lists and pickers for buildings, research entries and game texts.
[*]Plugin active switch per package; the Workshop Bridge loads exactly the packages you switched on.
[*]Personal values stay separate from the shipped INI, so a package update never overwrites them.
[*]Profiles and restore points for the whole plugin configuration.
[*]Log window with tesmioloader.log and every plugin log, problems highlighted.
[*]Save + Start launches the game through tesmiolauncher.exe.
[/list]

-- Requirements
[list]
[*]Workers & Resources: Soviet Republic 1.1.1.9
[*]TesmioLoader by MaxLegend, installed in the game folder (this item does not include it)
[*].NET Framework 4 (part of Windows 10 and 11)
[/list]

-- Installation
Easy way: open the folder of this Workshop item and double-click Install-RMM.bat. It finds the game, checks that the TesmioLoader is installed, copies everything into tesmioloader\build, switches the Workshop Bridge on and offers a desktop shortcut. Run it again after every update of this item.

By hand: the folder Manual Installation contains the complete tesmioloader folder to drag onto the game folder, plus WHERE.txt with the three steps.

-- Licence
Licensed under the GNU GPL v3; the licence ships with the package. Complete source code: [url=https://github.com/Kespri/workers-and-resources-mods]GitHub[/url].

-- Important Notes
This Workshop item contains a Windows program (rmm.exe) and a TesmioLoader DLL plugin (the Workshop Bridge), not a regular in-game script. Subscribing alone installs nothing; run the installer or follow WHERE.txt. Steam only updates this item folder, not the copy in the game folder.


-- German ----------------------------------------------------

### Republic Mod Manager – Einstellungen und Laden für TesmioLoader-Plugins

[HAFTUNGSAUSSCHLUSS] Genosse, Achtung: Dieses Programm wurde mit Hilfe einer künstlichen Intelligenz geschrieben. Die Fünfjahrespläne dazu hat trotzdem ein Mensch aufgestellt, getestet und beim Abstürzen des Spiels geflucht. Wer keine KI im Code möchte, bleibt einfach beim Grundspiel. Kein Hass, keine Umerziehung.

[HAFTUNGSAUSSCHLUSS] Dieses Programm ändert Dateien im Ordner tesmioloader des Spiels. Es können weiterhin Fehler oder Probleme auftreten, und die Funktionalität kann sich im Zuge der weiteren Entwicklung und Verbesserung ändern.

Ein Windows-Programm, das deine abonnierten TesmioLoader-Plugin-Pakete auflistet, jede Einstellung mit Beschreibung, Bereichsprüfung und Zurücksetzen-Knopf zeigt, Plugins ein- und ausschaltet und das Spiel über den TesmioLauncher startet. Die mitgelieferte Workshop Bridge lädt Workshop-Pakete direkt, ohne Soviet Mod Loader. Alles auf Deutsch und Englisch.

-- Funktionen
[list]
[*]Eine Liste mit jedem abonnierten Plugin-Paket und jedem Plugin, das in tesmioloader\build\plugins installiert ist.
[*]Einstellungsseiten aus dem Paketschema: Reiter, Karten, Schalter, Zahlenfelder mit Plus und Minus, Listen und Auswahlfenster für Gebäude, Forschungen und Spieltexte.
[*]Schalter Plugin aktiv je Paket; die Workshop Bridge lädt genau die Pakete, die du eingeschaltet hast.
[*]Persönliche Werte liegen getrennt von der ausgelieferten INI, ein Paket-Update überschreibt sie nie.
[*]Profile und Wiederherstellungspunkte für die ganze Plugin-Konfiguration.
[*]Protokollfenster mit tesmioloader.log und jedem Plugin-Protokoll, Probleme hervorgehoben.
[*]Speichern + Starten startet das Spiel über tesmiolauncher.exe.
[/list]

-- Voraussetzungen
[list]
[*]Workers & Resources: Soviet Republic 1.1.1.9
[*]TesmioLoader von MaxLegend, im Spielordner installiert (dieses Objekt enthält ihn nicht)
[*].NET Framework 4 (Teil von Windows 10 und 11)
[/list]

-- Installation
Der einfache Weg: den Ordner dieses Workshop-Objekts öffnen und Install-RMM.bat doppelklicken. Der Installer findet das Spiel, prüft, ob der TesmioLoader installiert ist, kopiert alles nach tesmioloader\build, schaltet die Workshop Bridge ein und bietet eine Desktop-Verknüpfung an. Nach jedem Update dieses Objekts einfach erneut ausführen.

Von Hand: der Ordner Manual Installation enthält den kompletten Ordner tesmioloader zum Drüberziehen auf den Spielordner, dazu WOHIN.txt mit den drei Schritten.

-- Lizenz
Lizenz GNU GPL v3; die Lizenz liegt im Paket bei. Vollständiger Quelltext: [url=https://github.com/Kespri/workers-and-resources-mods]GitHub[/url].

-- Hinweise
Dieses Workshop-Objekt enthält ein Windows-Programm (rmm.exe) und ein TesmioLoader-DLL-Plugin (die Workshop Bridge), kein gewöhnliches Spielskript. Das Abonnieren allein installiert nichts; starte den Installer oder folge WOHIN.txt. Steam aktualisiert nur diesen Objektordner, nicht die Kopie im Spielordner.
