; Republic Mod Manager - optional defaults. This file belongs beside rmm.exe in
; tesmioloader\build. Preferences saved from the window (folder
; %LOCALAPPDATA%\RepublicModManager) take priority over these values.
; UTF-8 without a BOM. Every key needs a value: leave a key out (or keep it
; commented) instead of writing an empty one.

[paths]
; workshop_root = folder with one subfolder per Workshop package. Without this
; key RMM uses the Steam Workshop folder of this game
; (steamapps\workshop\content\784150), which is right for everyone who
; subscribes to the packages on Steam. Example for another folder:
; workshop_root = D:\Mods\WRSR packages
; Optional: loader_build = C:\...\SovietRepublic\tesmioloader\build

[settings]
; auto = follows the Windows language (German or English); or de / en.
language = auto

; version_check = 0 disables the warning about an unknown game version (default 1).
version_check = 1

; tesmiolauncher_window = 1 shows the TesmioLauncher window on "Save + Start"
; (default 0: the game starts straight away with tesmiolauncher --nogui).
tesmiolauncher_window = 0

; launch_watch_seconds = how long RMM keeps watching after "Save + Start" whether the
; game stays up (default 15). A game that quits again right away is almost always a
; Steam client that no longer accepts a game started outside Steam; RMM says so.
; 0 closes the window at once, the way it worked before. Every key needs a value.
launch_watch_seconds = 15
