; Local launcher schema for the installed plugin "buildings_plus" (shipped with the
; Republic Mod Manager package into tesmioloader\build\plugins). Describes
; plugins\buildings_plus.ini: [buildings_plus] holds the switches, every other
; section is one generated building. Same fields as the package schema in
; My Plugins\buildings_plus\config; German texts in languages\de.ini (bp.*), the
; texts here are the English fallback. UTF-8 without BOM.

[launcher]
layout_version = 1
editor_type = keyed_sections
id = tesmio.buildings_plus.editor
name = Buildings Plus
name_key = bp.name
version = 0.1.2
description = New buildings from a declaration: a donor building of the game plus the building.ini lines that differ. Written as complete Workshop items at every game start.
description_key = bp.description
notice = Every building becomes a folder under media_soviet\workshop_wip with its own Workshop id. Leave the id empty and the plugin assigns the next free number from 9300000000 at game start and keeps it in plugins\buildings_plus.ids.ini. The game reads the folder like an unpublished Workshop item. Changes need a full restart. A saved game that contains such a building needs the folder when loading.
notice_key = bp.notice
notice_style = warning
icon = builtin:gear
language_directory = languages
default_tab = buildings

[editor]
plugin = buildings_plus
config = buildings_plus.ini
list_section = list
reserved_sections = buildings_plus|buildings
maximum_items = 256

[activity]
section = buildings_plus
key = enabled
values = 1

[tab:general]
label = General
label_key = bp.tab.general
order = 10

[tab:buildings]
label = Buildings
label_key = bp.tab.buildings
order = 20

[group:buildings]
tab = buildings
label = Buildings
label_key = bp.group
notice = Every building becomes a folder under media_soviet\workshop_wip with its own Workshop id. Leave the id empty and the plugin assigns the next free number from 9300000000 at game start and keeps it in plugins\buildings_plus.ids.ini. The game reads the folder like an unpublished Workshop item. Changes need a full restart. A saved game that contains such a building needs the folder when loading.
notice_key = bp.group.notice
notice_style = info

[list]
label = Buildings
label_key = bp.list
add_label = Add building
add_label_key = bp.add
select_help = Select a building on the left or use + to add one. The donor is asked first, the Workshop id may stay empty; name and lines follow on the right.
select_help_key = bp.select_help
id_label = Section
id_label_key = bp.id
id_help = Names the building in the log and in the generated files; it cannot be renamed later. An automatically assigned Workshop id is tied to this name.
id_help_key = bp.id.help
save_warning = Changes are written to the effective buildings_plus.ini only when saved and take effect after a complete game restart. The plugin then writes the folder under media_soviet\workshop_wip; a section with an error is skipped and named in the log.
save_warning_key = bp.save_warning
summary = donor|id
note = At most 256 buildings.
note_key = bp.list.note

[new]
name_label = Section name
name_label_key = bp.new_name
hint = Enter a section name and the donor. The Workshop id may stay empty, then the plugin assigns one at game start. Name, description and lines are entered on the right afterwards.\nSpaces turn into underscores, capitals into lower case.
hint_key = bp.new_hint

[global]
tab = general
label = Troubleshooting
label_key = bp.plugin

[detail:prune]
scope = global
section = buildings_plus
key = prune
type = boolean
label = Clean up folders
label_key = bp.prune
description = ON removes the generated folder of a building you deleted or switched off at the next game start (only folders this plugin wrote).\nOFF leaves such folders in place; the game keeps loading those buildings.
description_key = bp.prune.description
order = 10

[detail:always]
scope = global
section = buildings_plus
key = always
type = boolean
label = Always rewrite
label_key = bp.always
description = ON writes every building folder at every game start.\nOFF writes a folder only when its section, the plugin or a donor file changed. Keep it OFF.
description_key = bp.always.description
order = 20

[detail:verbose]
scope = global
section = buildings_plus
key = verbose
type = boolean
label = Detailed log
label_key = bp.verbose
description = ON writes every copied file and every removed donor line to logs\tesmioloader.buildings_plus.log.\nOFF writes results, warnings and errors only.
description_key = bp.verbose.description
order = 30

[detail:bp_enabled]
scope = item
key = enabled
type = boolean
position = above_id
default = 1
label = Building enabled
label_key = bp.enabled
description = OFF keeps the section but generates nothing; with "Clean up folders" ON its folder is removed at the next start.
description_key = bp.enabled.description
order = 10

[detail:bp_id]
scope = item
key = id
type = text
maximum_length = 10
unique = 1
assigned_from = build:plugins\buildings_plus.ids.ini|ids
dialog = 1
label = Workshop id
label_key = bp.item_id
description = Empty = the plugin assigns the next free number from 9300000000 at game start and keeps it in plugins\buildings_plus.ids.ini. Own number: 9000000000 to 9999999999, unique among your buildings. It names the folder under workshop_wip and is stored in saved games; never change it once the building is in use.
description_key = bp.item_id.description
order = 20

[detail:bp_donor]
scope = item
key = donor
type = text
maximum_length = 64
picker = game_donor
reference = game_donor
dialog = 1
label = Donor building
label_key = bp.donor
description = The game building the copy starts from: its name under media_soviet\buildings_types without .ini, for example bauxite_mine. Use "Choose donor…" to find it in the list of all base-game buildings. Match the kind: a mine for a mine, a factory for a factory, a shop for a shop.
description_key = bp.donor.description
order = 30

[detail:bp_object]
scope = item
key = object
type = text
maximum_length = 64
label = Object name
label_key = bp.object
description = Folder and object name of the generated item, letters, digits and _ only. Empty = the section name.
description_key = bp.object.description
order = 40

[detail:bp_name]
scope = item
key = name
type = text
maximum_length = 128
label = Name in the game
label_key = bp.item_name
description = The name in the build menu and in the Workshop entry. Plain text, no quotes. Empty = the object name.
description_key = bp.item_name.description
order = 50

[detail:bp_desc]
scope = item
key = desc
type = lines
label = Description
label_key = bp.desc
description = The description of the Workshop entry, one line per row. No quotes.
description_key = bp.desc.description
order = 60

[detail:bp_line]
scope = item
key = line
type = lines
picker = donor_lines
label = building.ini lines
label_key = bp.line
description = One building.ini line per row, for example $PRODUCTION raw_salt 1.0. Use "Choose line…" to take a line out of the donor building and adjust it. Your lines go in front of the donor's and replace: the same token; every $TYPE_*; every $STORAGE* together with $RESOURCE_VISUALIZATION; $PRODUCTION, $CONSUMPTION and $CONSUMPTION_PER_SECOND as one recipe. Everything else of the donor stays.\nFor your own resources always use $STORAGE_IMPORT_SPECIAL or $STORAGE_EXPORT_SPECIAL with the resource named, otherwise the storage lists every resource of the transport class.
description_key = bp.line.description
order = 70

[detail:bp_strip]
scope = item
key = strip
type = lines
label = Remove donor lines
label_key = bp.strip
description = One $TOKEN per row, for example $WORKERS_NEEDED. Every donor line with that token is dropped without replacement.
description_key = bp.strip.description
order = 80

[detail:bp_life]
scope = item
key = life
type = integer
minimum = 1
maximum = 1000000
step = 500
label = Life
label_key = bp.life
description = LIFE in renderconfig.ini: how much the building can take before it collapses. Empty = 3000, like most game buildings.
description_key = bp.life.description
order = 90
